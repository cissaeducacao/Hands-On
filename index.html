<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hands-on by CISSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #D25600; --primary-acao: #bd4d00; --secondary: #375B95; --on-primary: #ffffff; --on-secondary: #ffffff;
    --primary-soft: color-mix(in srgb, var(--primary) 11%, #fff);
    --secondary-soft: color-mix(in srgb, var(--secondary) 10%, #fff);
    --ink: #1c2333; --muted: #596275; --line: #dce0ea; --bg: #f5f6f9; --card: #ffffff;
    --ok: #1d7a46; --ok-soft: #e3f4ea; --warn: #7a4e00; --warn-soft: #fff1d6; --danger: #a8231b; --danger-soft: #fde8e6;
    --radius: 10px; --font: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--bg); }
  h1, h2, h3 { line-height: 1.2; margin: 0 0 .5em; font-weight: 700; letter-spacing: -0.01em; }
  h1 { font-size: clamp(1.55rem, 4.5vw, 2.15rem); } h2 { font-size: 1.3rem; } h3 { font-size: 1.05rem; }
  h1:focus { outline: none; }
  p { margin: 0 0 1em; } a { color: var(--secondary); }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--secondary) 65%, #fff); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .oculto { display: none !important; }
  .pular { position: absolute; left: -999px; top: 0; background: #fff; padding: 8px 14px; z-index: 100; }
  .pular:focus { left: 8px; top: 8px; }

  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  body.largo main { max-width: 1240px; }
  .rodape { max-width: 760px; margin: 0 auto; padding: 0 16px 32px; font-size: .88rem; color: var(--muted); display: flex; gap: 8px 18px; flex-wrap: wrap; }
  body.largo .rodape { max-width: 1240px; }
  .faixa { padding: 10px 16px; text-align: center; font-weight: 500; font-size: .92rem; background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid #f0d9a0; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
  .card + .card { margin-top: 16px; }
  .card h2 { margin-bottom: .6em; }
  .muted { color: var(--muted); }
  .pequeno { font-size: .88rem; }
  .linha { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .linha.entre { justify-content: space-between; }

  /* capa do evento */
  .card.capa { padding: 0; overflow: hidden; border-radius: 14px; }
  .capa-img { display: block; width: 100%; height: auto; max-height: 420px; object-fit: contain; background: var(--secondary-soft); }
  .capa-faixa { background: var(--secondary); color: var(--on-secondary); padding: 28px 22px 22px; }
  .capa-faixa h1 { margin: 0; }
  .capa-corpo { padding: 20px 22px 24px; }
  .capa-corpo .sub { font-size: 1.1rem; color: var(--muted); margin-bottom: 14px; }
  .meta { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0 0 18px; font-size: .95rem; }
  .meta dt { color: var(--muted); } .meta dd { margin: 0; font-weight: 500; }

  /* agenda: o bloco de data é a informação principal do dia */
  .agenda { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 8px; }
  .agenda li { display: grid; grid-template-columns: 62px 1fr; gap: 14px; align-items: center; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px 8px 8px; background: var(--card); }
  .data-bloco { background: var(--secondary-soft); border-radius: 8px; text-align: center; padding: 6px 0; line-height: 1.1; }
  .data-bloco b { display: block; font-size: 1.5rem; color: var(--secondary); }
  .data-bloco span { font-size: .8rem; color: var(--muted); }
  .agenda .tit { font-weight: 500; } .agenda .det { color: var(--muted); font-size: .92rem; }
  .agenda .linha.entre { flex-wrap: nowrap; align-items: flex-start; gap: 8px; }
  .agenda .tit { min-width: 0; } .chip { flex: none; }
  .agenda li.hoje { border-color: var(--secondary); box-shadow: inset 4px 0 0 var(--secondary); }

  /* botões */
  .btn { appearance: none; font: inherit; font-weight: 500; min-height: 46px; padding: 10px 20px; border-radius: var(--radius); border: 1.5px solid transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; text-align: center; }
  .btn.primario { background: var(--primary-acao); color: var(--on-primary); }
  .btn.primario:hover { background: color-mix(in srgb, var(--primary-acao) 85%, #000); }
  .btn.secundario { background: #fff; color: var(--ink); border-color: var(--ink); }
  .btn.secundario:hover { background: var(--secondary-soft); }
  .btn.discreto { background: transparent; color: var(--secondary); text-decoration: underline; min-height: 40px; padding: 6px 10px; }
  .btn.perigo { background: #fff; color: var(--danger); border-color: var(--danger); }
  .btn.pequeno { min-height: 36px; padding: 4px 12px; font-size: .9rem; }
  .btn[disabled] { opacity: .55; cursor: not-allowed; }
  .btn.bloco { width: 100%; margin-top: 14px; }
  .card .btn.discreto { margin-left: -10px; }
  input:disabled, select:disabled, textarea:disabled { background: #eef0f5; color: var(--muted); border-color: var(--line); }
  .acoes { display: grid; gap: 10px; margin-top: 8px; }
  .acoes .btn { width: 100%; }

  /* formulários */

  .campo .dica { display: block; font-size: .86rem; color: var(--muted); margin-top: 3px; }
  input[type=text], input[type=email], input[type=password], input[type=tel], input[type=search], input[type=number], input[type=date], input[type=datetime-local], input[type=time], input[type=url], input[type=file], select, textarea {
    width: 100%; font: inherit; color: var(--ink); background: #fff; border: 1.5px solid #8a93a6; border-radius: 8px; padding: 10px 12px; min-height: 44px; }
  textarea { min-height: 90px; resize: vertical; }
  input[type=color] { width: 72px; height: 44px; padding: 3px; border: 1.5px solid #8a93a6; border-radius: 8px; background: #fff; }
  input[type=file] { padding: 8px; }
  input[type=checkbox], input[type=radio] { width: 20px; height: 20px; accent-color: var(--secondary); flex: none; margin: 2px 0 0; }
  .marca { display: flex; gap: 10px; align-items: flex-start; margin: 6px 0; font-weight: 400; }
  .marca label { font-weight: 400; margin: 0; }
  fieldset { border: 0; padding: 0; margin: 0 0 14px; min-width: 0; }
  .codigo-aula { font-size: 1.4rem; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; text-align: center; }
  .isca { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .grade2 { display: grid; gap: 0 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

  /* mensagens */
  .msg { border-radius: var(--radius); padding: 10px 14px; margin: 0 0 14px; font-size: .95rem; border: 1px solid; }
  .msg.erro { background: var(--danger-soft); color: var(--danger); border-color: #f2b8b3; }
  .msg.ok { background: var(--ok-soft); color: var(--ok); border-color: #b3dcc3; }
  .msg.aviso { background: var(--warn-soft); color: var(--warn); border-color: #f0d9a0; }
  .msg.info { background: var(--secondary-soft); color: var(--ink); border-color: color-mix(in srgb, var(--secondary) 30%, #fff); }
  .msg:empty { display: none; }
  .chip { display: inline-block; font-size: .82rem; font-weight: 500; padding: 2px 10px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); border-color: #b3dcc3; }
  .chip.falta { background: var(--danger-soft); color: var(--danger); border-color: #f2b8b3; }
  .chip.hoje { background: var(--secondary); color: var(--on-secondary); border-color: var(--secondary); }
  .chip.neutro { background: #fff; color: var(--muted); border-color: var(--line); }
  .chip.aviso { background: var(--warn-soft); color: var(--warn); border-color: #f0d9a0; }

  /* tabelas */
  .tabela-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 500; color: var(--muted); background: #fafbfc; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .08em; }

  /* painel da equipe */
  .topo-painel { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .abas { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .aba { appearance: none; font: inherit; background: transparent; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer; color: var(--muted); font-weight: 500; min-height: 44px; }
  .aba[aria-selected=true] { color: var(--ink); border-bottom-color: var(--primary); }
  .aba:hover { color: var(--ink); }
  .metricas { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 16px; }
  .metrica { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .metrica b { display: block; font-size: 1.7rem; line-height: 1.1; } .metrica span { color: var(--muted); font-size: .88rem; }
  .barra { height: 10px; background: var(--secondary-soft); border-radius: 999px; overflow: hidden; } .barra i { display: block; height: 100%; background: var(--secondary); }

  dialog { border: 0; border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 24px); box-shadow: 0 20px 60px rgba(20,30,60,.35); color: var(--ink); }
  dialog::backdrop { background: rgba(20,30,60,.55); }
  .dlg-corpo { padding: 20px 22px; overflow: auto; max-height: calc(100vh - 150px); }
  .dlg-rodape { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; background: #fafbfc; }

  .toasts { position: fixed; right: 12px; bottom: 12px; left: 12px; display: grid; gap: 8px; justify-items: end; z-index: 60; pointer-events: none; }
  .toast { background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; max-width: 460px; font-size: .95rem; pointer-events: auto; }
  .toast.erro { background: var(--danger); } .toast.ok { background: var(--ok); }
  .carregando { position: fixed; inset: 0; background: rgba(245,246,249,.82); display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; z-index: 80; font-weight: 500; }
  .spin { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--secondary); animation: gira .9s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; border-top-color: var(--secondary); border-right-color: var(--secondary); } }
  .vazio { text-align: center; padding: 28px 12px; color: var(--muted); }
  .nps { display: grid; grid-template-columns: repeat(auto-fit, minmax(46px, 1fr)); gap: 6px; }
  .nps label { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1.5px solid #8a93a6; border-radius: 8px; padding: 8px 0; cursor: pointer; font-weight: 500; }
  .nps input:checked + span { color: var(--on-primary); }
  .nps label:has(input:checked) { background: var(--primary-acao); color: var(--on-primary); border-color: var(--primary-acao); }
  .nps input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .nps label:has(input:focus-visible) { outline: 3px solid color-mix(in srgb, var(--secondary) 65%, #fff); outline-offset: 2px; }
  .escalas { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  @media (max-width: 560px) { .card { padding: 16px; } .abas { overflow-x: auto; flex-wrap: nowrap; } .aba { white-space: nowrap; } }
</style>

<body>
<a class="pular" href="#app">Pular para o conteúdo</a>
<div id="faixa-teste" class="faixa oculto" role="status"></div>
<main id="app" tabindex="-1"></main>
<footer class="rodape" id="rodape"></footer>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script type="application/json" id="server-params">{"appsScriptUrl":"URL_DO_EXEC"}</script>
<script>
'use strict';
/* ====================== base: utilidades, transporte, tema ====================== */
// Substitui os filhos de um elemento aceitando listas aninhadas e ignorando null/false (o replaceChildren nativo escreveria "null" ou "[object ...]").
Element.prototype.preencher = function (...nos) { this.replaceChildren(...nos.flat(Infinity).filter(x => x != null && x !== false)); };
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function h(tag, attrs, ...filhos) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (['checked', 'disabled', 'hidden', 'required', 'selected', 'multiple'].includes(k)) el[k] = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  filhos.flat(Infinity).forEach(f => { if (f == null || f === false) return; el.append(f.nodeType ? f : document.createTextNode(String(f))); });
  return el;
}
// Os dados do servidor são injetados como JSON dentro de um script do tipo application/json.
// Fora do Apps Script (Netlify) o conteúdo não é preenchido; nesse caso a configuração é pedida pela ponte.
const SERVER_PARAMS = (() => { try { const o = JSON.parse($('#server-params').textContent); return (o && typeof o === 'object') ? o : {}; } catch (e) { return {}; } })();
const App = { cfg: {}, tokenP: null, nomeP: '', tokenE: null, usuario: null, aba: null, chavesCfg: null };
const PARAMS_URL = new URLSearchParams(location.search);
const NO_APPS_SCRIPT = typeof google !== 'undefined' && !!google.script && !!google.script.run;

/** Chama o servidor: google.script.run no Apps Script, ou a ponte /.netlify/functions/api na Netlify. */
const URL_APPS_SCRIPT = /^https:\/\/script\.google\.com\/(?:a\/macros\/[A-Za-z0-9.-]+\/|macros\/)s\/[A-Za-z0-9_-]+\/exec$/;
function rpc(nome, ...args) {
  if (NO_APPS_SCRIPT) return new Promise((ok, falha) => { google.script.run.withSuccessHandler(ok).withFailureHandler(e => falha(e))[nome](...args); });
  if (SERVER_PARAMS.appsScriptUrl && URL_APPS_SCRIPT.test(SERVER_PARAMS.appsScriptUrl)) return rpcDireto(nome, args); // GitHub Pages: chama o Apps Script sem função intermediária
  return rpcPonte(nome, args); // Netlify: chama a função da ponte
}
function lerRespostaApi(resp, texto) {
  let o = null; try { o = JSON.parse(texto); } catch (e) { o = null; }
  if (!o || typeof o.sucesso !== 'boolean') throw new Error('O servidor demorou ou respondeu de forma inesperada (código ' + resp.status + '). Tente de novo em instantes.');
  if (!o.sucesso) throw new Error(o.erro || 'Erro desconhecido.');
  return o.resultado;
}
async function rpcPonte(nome, args) {
  let resp, texto;
  try {
    resp = await fetch('/.netlify/functions/api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn: nome, args }) });
    texto = await resp.text();
  } catch (e) { throw new Error('Não foi possível falar com o servidor. Confira sua conexão e tente de novo.'); }
  return lerRespostaApi(resp, texto);
}
/** Chamada direta ao /exec. O corpo é text/plain de propósito: assim o navegador não faz a pré-verificação (preflight), que o Apps Script não atende. */
async function rpcDireto(nome, args) {
  let resp, texto; const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 120000);
  try {
    resp = await fetch(SERVER_PARAMS.appsScriptUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: nome, args }), redirect: 'follow', signal: ctl.signal });
    texto = await resp.text();
  } catch (e) { throw new Error(e && e.name === 'AbortError' ? 'O servidor demorou demais para responder. Tente de novo em instantes.' : 'Não foi possível falar com o servidor. Confira sua conexão e tente de novo.'); }
  finally { clearTimeout(t); }
  return lerRespostaApi(resp, texto);
}
const msgErro = e => String((e && e.message) || e || 'Erro desconhecido').replace(/^Error:\s*/, '').replace(/^[A-Z_]{6,}:\s*/, '');
const textoErro = e => String((e && e.message) || e || '');
const sessaoExpirou = e => /SESSAO_EXPIRADA/.test(textoErro(e));
const exigeTroca = e => /TROCAR_SENHA/.test(textoErro(e));

const fmtNum = n => (n == null ? '-' : Number(n).toLocaleString('pt-BR'));
const horasTxt = n => String(Math.round(Number(n) * 100) / 100).replace('.', ',');
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

/* ---- CPF ---- */
const soDigitos = s => String(s == null ? '' : s).replace(/\D/g, '');
function cpfValido(c) {
  const d = soDigitos(c); if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
  for (let t = 9; t < 11; t++) { let s = 0; for (let i = 0; i < t; i++) s += +d[i] * (t + 1 - i); const r = (s * 10) % 11 % 10; if (r !== +d[t]) return false; }
  return true;
}
function mascaraCpf(v) { const d = soDigitos(v).slice(0, 11); return d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2'); }

/* ---- tema (cores configuráveis) com contraste verificado ---- */
function lum(hex) { const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16) / 255).map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)); return 0.2126 * r + 0.7152 * g + 0.0722 * b; }
function contraste(a, b) { const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m); return (x + 0.05) / (y + 0.05); }
function misturaPreto(hex, k) { return '#' + [1, 3, 5].map(i => Math.round(parseInt(hex.substr(i, 2), 16) * (1 - k)).toString(16).padStart(2, '0')).join(''); }
/** Escurece a cor até o texto branco passar de 4,5:1 (nível AA para texto normal). */
function corParaBotao(hex) { for (let k = 0; k <= 0.6; k += 0.02) { const c = misturaPreto(hex, k); if (contraste(c, '#ffffff') >= 4.5) return c; } return '#000000'; }
function aplicarTema(cfg) {
  const ok = c => /^#[0-9a-fA-F]{6}$/.test(c || '');
  const p = ok(cfg.corPrimaria) ? cfg.corPrimaria : '#D25600', s = ok(cfg.corSecundaria) ? cfg.corSecundaria : '#375B95', r = document.documentElement.style;
  r.setProperty('--primary', p); r.setProperty('--primary-acao', corParaBotao(p)); r.setProperty('--secondary', corParaBotao(s));
  r.setProperty('--on-primary', '#ffffff'); r.setProperty('--on-secondary', '#ffffff');
  document.title = cfg.nome || 'Hands-on by CISSA';
  const f = $('#faixa-teste');
  if (cfg.statusEvento === 'Homologação') { f.textContent = 'Ambiente de testes: os dados desta edição não valem.'; f.classList.remove('oculto'); } else f.classList.add('oculto');
}

/* ---- interface comum ---- */
function toast(msg, tipo) { const t = h('div', { class: 'toast ' + (tipo || ''), text: msg }); $('#toasts').append(t); setTimeout(() => t.remove(), 5200); }
function carregando(txt) {
  let el = $('#carregando');
  if (!el) { el = h('div', { id: 'carregando', class: 'carregando', role: 'alert', 'aria-busy': 'true' }, h('div', { class: 'spin' }), h('div', { id: 'carregando-txt' })); document.body.append(el); }
  $('#carregando-txt').textContent = txt || 'Carregando...';
}
function fimCarregando() { const el = $('#carregando'); if (el) el.remove(); }
/** Executa uma chamada com indicador de carregamento. contexto: 'equipe' | 'participante' trata a sessão expirada. */
async function executar(texto, fn, contexto) {
  carregando(texto);
  try { return await fn(); }
  catch (e) {
    fimCarregando();
    if (sessaoExpirou(e)) {
      if (contexto === 'equipe') { App.tokenE = null; telaEquipeLogin('Sua sessão expirou. Entre de novo.'); }
      else if (contexto === 'participante') { App.tokenP = null; telaLoginArea('Sua sessão expirou. Entre de novo.'); }
      else toast('Sua sessão expirou.', 'erro');
    } else if (exigeTroca(e)) {
      if (contexto === 'equipe') telaTrocarSenhaEquipe(true); else if (contexto === 'participante') telaTrocarSenha(true, false);
    } else toast(msgErro(e), 'erro');
    return undefined;
  } finally { fimCarregando(); }
}
function mostrar(titulo, ...nos) {
  const app = $('#app');
  app.preencher(...nos.flat().filter(Boolean));

/** Reduz a imagem do banner antes do envio (menos tráfego e menos risco de estourar o limite de envio). */
function prepararBanner(file) {
  return new Promise((ok, falha) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      if (file.size <= 1.5 * 1024 * 1024 && img.width <= 1600) { lerArquivoBase64(file).then(b => ok({ nome: file.name, base64: b })).catch(falha); return; }
      const esc = Math.min(1, 1600 / img.width), c = document.createElement('canvas'); c.width = Math.round(img.width * esc); c.height = Math.round(img.height * esc);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? lerArquivoBase64(b).then(x => ok({ nome: file.name.replace(/\.\w+$/, '') + '.jpg', base64: x })).catch(falha) : falha(new Error('Não foi possível reduzir a imagem.')), 'image/jpeg', 0.88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); falha(new Error('Não foi possível abrir a imagem. Use JPG, PNG, WebP ou GIF.')); };
    img.src = url;
  });
}
